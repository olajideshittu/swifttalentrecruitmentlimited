<!DOCTYPE html>
<html>
<head>
    <title>{{ product.name }} - Product Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .detail-card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 24px rgba(44,62,80,0.10);
            max-width: 600px;
            margin: 40px auto;
            padding: 32px 32px 24px 32px;
        }
        .detail-header {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            color: #2d3e50;
            margin-bottom: 18px;
        }
        .detail-img {
            display: block;
            margin: 0 auto 18px auto;
            width: 180px;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(44,62,80,0.08);
        }
        .detail-desc {
            font-size: 1.13rem;
            color: #333;
            margin-bottom: 18px;
            text-align: center;
        }
        .detail-table {
            margin: 0 auto;
            border-collapse: collapse;
            width: 100%;
            background: #f8f9fa;
            border-radius: 8px;
            overflow: hidden;
        }
        .detail-table th, .detail-table td {
            padding: 10px 16px;
            border-bottom: 1px solid #e0e0e0;
            text-align: left;
            font-size: 1.04rem;
        }
        .detail-table th {
            background: #f0f4fa;
            color: #2d3e50;
            font-weight: 600;
            width: 140px;
        }
        .detail-table tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <nav style="background:#fff; border-bottom:1px solid #e0e0e0; padding:0 0 0 24px; display:flex; align-items:center; height:56px;">
        <span style="font-weight:bold; font-size:1.2rem; color:#2d3e50; margin-right:32px;">Product Recommender</span>
        <a href="{{ url_for('text_query_page') }}" style="margin-right:18px; color:#1976d2; text-decoration:none;">Text Query</a>
        <a href="{{ url_for('ocr_query_page') }}" style="margin-right:18px; color:#1976d2; text-decoration:none;">OCR Query</a>
        <a href="{{ url_for('product_image_upload_page') }}" style="color:#1976d2; text-decoration:none;">Product Image Upload</a>
    </nav>
    <div class="detail-card">
        <div class="detail-header">{{ product.name }}</div>
        <img src="{{ url_for('static', filename=product.image) }}" alt="{{ product.name }}" class="detail-img">
        <div class="detail-desc">{{ product.description }}</div>
        <table class="detail-table">
            <tr><th>Price</th><td>{{ product.price }}</td></tr>
            <tr><th>Country</th><td>{{ product.country }}</td></tr>
            <tr><th>Size</th><td>{{ product.size }}</td></tr>
            <tr><th>Color</th><td>{{ product.color }}</td></tr>
        </table>
    </div>
</body>
</html>
